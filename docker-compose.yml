# Local development database. Start with: docker compose up -d
# Host port 5433 (5432 is often taken by another local Postgres).
services:
  db:
    image: postgres:17-alpine
    container_name: instantpainel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: instantpainel
      POSTGRES_PASSWORD: instantpainel
      POSTGRES_DB: instantpainel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the e2e test database on first start
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instantpainel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
